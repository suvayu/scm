name: Reusable workflow to test scm package wheels

on:
  workflow_call:
    inputs:
      ver:
        description: Release tag
        type: string
        required: true
      os:
        description: Operating System/Platform
        type: string
        required: true
      python:
        description: Python version
        type: string
        required: true

jobs:
  test-whl:
    if: inputs.ver != 'skip'
    runs-on: ${{ inputs.os }}
    steps:
    - name: Make dist directory
      run: mkdir -p dist
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Checkout scm
      uses: actions/checkout@v4
      with:
        repository: 'suvayu/scm'
        path: scm
        ref: ${{ inputs.ver }}
    - name: Set up Python ${{ inputs.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python }}
    - name: Install pytest and built wheels on *NIX
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        python -m pip install dist/*/*.whl
        python -m pip install pytest
    - name: Install pytest and built wheels on Windows
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        python -m pip install $(Get-ChildItem ./dist/*/*.whl).FullName
        python -m pip install pytest
    - name: Remove source from checkouts for *NIX
      if: runner.os != 'Windows'
      run: |
        rm -rf scm/foo
    - name: Remove source from checkouts for Windows
      if: runner.os == 'Windows'
      run: |
        Remove-Item scm/foo -Recurse -Force -ErrorAction Ignore
    - name: Test wheels
      run: |
        python -m pytest scm
